<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="frame-src https://www.youtube-nocookie.com" />
    <title>Iridium</title>
    <base href="/" />
    <script src="js/appearance.js"></script>
    <script src="lib/livekit/livekit-client.umd.js"></script>
    <script type="module" src="js/clientUpdate.js"></script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/profile-actions.css" />
    <link rel="stylesheet" href="css/role-management.css" />
    <link rel="stylesheet" href="css/notification-scale.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Iridium.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">&times;</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
            .then(registration => registration.update())
            .catch(() => {});
    </script>
</body>

</html>
